<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mão na Roda - Conectando quem faz com quem precisa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.9);
            position: fixed;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #07D4D5;
            box-shadow: 0 0 15px rgba(7, 212, 213, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .brand-name {
            margin-left: 15px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #E91E63, #07D4D5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        main {
            margin-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 20px;
            max-width: 800px;
        }
        h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        p {
            font-size: 20px;
            color: #94A3B8;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border: none;
        }
        .btn-android {
            background: linear-gradient(90deg, #E91E63, #FF4081);
            color: white;
            box-shadow: 0 10px 20px rgba(233, 30, 99, 0.3);
        }
        .btn-android:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(233, 30, 99, 0.5);
        }
        .btn-web {
            background-color: transparent;
            color: #07D4D5;
            border: 2px solid #07D4D5;
            box-shadow: 0 10px 20px rgba(7, 212, 213, 0.1);
        }
        .btn-web:hover {
            background-color: rgba(7, 212, 213, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(7, 212, 213, 0.3);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo Mão na Roda">
        </div>
        <div class="brand-name">MÃO NA RODA</div>
    </header>
    
    <main>
        <h1>Conectando quem faz com quem precisa!</h1>
        <p>Encontre os melhores profissionais da sua região em poucos cliques. Serviços rápidos, seguros e eficientes direto no seu celular.</p>
        
        <div class="btn-container">
            <a href="#" class="btn btn-android" onclick="alert('APK estará disponível em breve após a compilação final!')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Baixar para Android
            </a>
            <a href="app/" class="btn btn-web">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                Acessar Versão Web
            </a>
        </div>
    </main>
</body>
</html>
