<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha • Mão na Roda</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK Compatível -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-dark: #080A0E;
            --bg-card: #10141D;
            --border: #1E2633;
            --cyan: #00E5FF;
            --pink: #FF0080;
            --green: #00E676;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFF, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.sub {
            color: var(--text-secondary);
            font-size: 13.5px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .user-pill {
            display: inline-block;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 24px;
            word-break: break-all;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #FFF;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--cyan), #00B0FF);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .msg-box {
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            line-height: 1.4;
        }

        .msg-error {
            background: rgba(255, 0, 128, 0.1);
            border: 1px solid rgba(255, 0, 128, 0.3);
            color: #FF4081;
        }

        .msg-success {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--green);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="favicon.png" alt="Mão na Roda">
            <span class="logo-text">MÃO NA RODA</span>
        </div>

        <div id="loadingView">
            <h1>Verificando Link...</h1>
            <p class="sub">Aguarde um instante enquanto validamos sua solicitação.</p>
            <div class="loading-spinner" style="border-top-color: var(--cyan); width: 30px; height: 30px; margin: 20px 0;"></div>
        </div>

        <div id="formView" style="display: none;">
            <h1>Criar Nova Senha</h1>
            <p class="sub">Digite uma nova senha segura para acessar sua conta no Mão na Roda.</p>
            
            <div class="user-pill" id="targetEmail">carregando...</div>

            <form id="resetForm" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label for="newPass">Nova Senha</label>
                    <input type="password" id="newPass" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmPass">Confirmar Nova Senha</label>
                    <input type="password" id="confirmPass" required minlength="6" placeholder="Repita a nova senha" autocomplete="new-password">
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    Salvar Nova Senha
                </button>
            </form>
        </div>

        <div id="msgBox" class="msg-box"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCU3MBGTs8lEYXQMtpKTnkXEUFEC7u3Sfg",
            authDomain: "impetus-mvp.firebaseapp.com",
            projectId: "impetus-mvp",
            storageBucket: "impetus-mvp.firebasestorage.app",
            messagingSenderId: "1009745627399",
            appId: "1:1009745627399:web:ad719c8431a0ca7b565da2"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();

        // Extrai o oobCode da URL
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        const loadingView = document.getElementById('loadingView');
        const formView = document.getElementById('formView');
        const targetEmail = document.getElementById('targetEmail');
        const msgBox = document.getElementById('msgBox');
        const btnSubmit = document.getElementById('btnSubmit');

        function showMessage(text, isError = true) {
            msgBox.textContent = text;
            msgBox.className = 'msg-box ' + (isError ? 'msg-error' : 'msg-success');
            msgBox.style.display = 'block';
        }

        async function verifyCode() {
            if (!oobCode) {
                loadingView.style.display = 'none';
                showMessage('Código de recuperação inválido ou ausente. Solicite um novo link.', true);
                return;
            }

            try {
                // Valida o código com o Firebase usando a origem autorizada appmaonaroda.com.br
                const email = await auth.verifyPasswordResetCode(oobCode);
                targetEmail.textContent = email;
                loadingView.style.display = 'none';
                formView.style.display = 'block';
            } catch (err) {
                loadingView.style.display = 'none';
                console.error(err);
                if (err.code === 'auth/expired-action-code') {
                    showMessage('Este link já expirou ou foi substituído por uma solicitação mais recente. Peça para redefinir novamente.', true);
                } else {
                    showMessage('Não foi possível validar este link (' + (err.message || 'Código inválido') + '). Peça uma nova solicitação.', true);
                }
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;

            if (p1.length < 6) {
                showMessage('A senha deve ter pelo menos 6 caracteres.', true);
                return;
            }

            if (p1 !== p2) {
                showMessage('As senhas digitadas não coincidem. Verifique e tente novamente.', true);
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="loading-spinner"></span>Salvando...';
            msgBox.style.display = 'none';

            try {
                await auth.confirmPasswordReset(oobCode, p1);
                formView.style.display = 'none';
                showMessage('🎉 Senha alterada com sucesso! Você já pode entrar no aplicativo Mão na Roda.', false);
                setTimeout(() => {
                    window.location.href = 'https://appmaonaroda.com.br/app/';
                }, 3000);
            } catch (err) {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Salvar Nova Senha';
                console.error(err);
                showMessage('Erro ao salvar nova senha: ' + (err.message || 'Tente novamente.'), true);
            }
        }

        window.addEventListener('DOMContentLoaded', verifyCode);
    </script>
</body>
</html>
